const HELP=[["ANTES DE COMEÇAR", [["O que acontece se eu remover o app ou limpar os dados do navegador?", "Os clientes cadastrados só voltam pelo backup. {r}A licença de ativação é perdida{/r} e será preciso {r}comprar uma nova{/r}. Por isso, exporte o backup toda semana e guarde o arquivo fora do celular.\n\n{g}Apagar só o histórico de navegação não afeta nada.{/g} O que apaga é limpar os dados ou cookies de sites."], ["Como ativar o aplicativo?", "O app funciona 7 dias em teste, contados a partir do primeiro cliente cadastrado. Para continuar usando, faça a ativação: R$ {preco}, válida para este aparelho.\n\nToque no aviso do período de teste na aba Hoje (ou espere a tela de fim do teste) e siga os passos: toque em Pagar ativação, digite o valor {preco}, selecione Pix e toque em Continuar, copie o código Pix Copia e Cola e pague no app do seu banco.\n\nDepois, toque em Enviar comprovante no Telegram e mande o comprovante junto com o código do aparelho que aparece na tela. Você recebe o código de ativação: digite no campo Código de ativação e toque em Ativar."]]],["CLIENTES", [["Como cadastrar um novo cliente?", "Clientes > Novo cliente. Escolha o servidor na lista, preencha nome, telefone, usuário, senha, valor, conexões e vencimento e toque em Salvar. O valor pode ser 0. Quanto mais campos preencher, mais ferramentas o app libera. Se não houver servidor, cadastre antes em Gestão. Para licença de aplicativo, escolha o Tipo Licença de app: os campos mudam para os da licença."], ["Como cadastrar uma licença de app?", "Clientes > Novo cliente e escolha o Tipo Licença de app. Servidor, usuário, senha e conexões somem. Escolha o aplicativo na lista (cadastre antes em Gestão > Aplicativos) e preencha MAC/key, valor, vencimento e duração (1 ano ou Vitalício).\n\nSe a licença usa créditos de um painel, escolha o Painel de créditos: o lucro é calculado sozinho e o Ativar desconta os créditos do painel (Desfazer ativação devolve). Sem painel, não há desconto e o lucro é digitado à mão.\n\nNa duração Vitalício não há vencimento: toque em Pagou, ative em Recargas para fazer e a licença fica com a etiqueta vitalícia.\n\nAtalho: em Editar cliente de uma assinatura, toque em + Criar licença para este cliente. O app salva a assinatura e abre a licença já com nome, telefone, Telegram e duração de 1 ano. A assinatura não muda: a licença é um cartão separado.\n\nQuando o cliente pagar, toque em Pagou. No vencimento, a licença aparece em Recargas para fazer: ative no aplicativo e toque em Ativar."], ["Cliente com mais de um usuário e senha", "Quando o mesmo cliente paga uma cobrança só, mas tem mais de um usuário e senha (até em servidores diferentes), cadastre cada usuário como uma ficha com o mesmo nome. Ao salvar, o app pergunta: Esta ficha é uma conta extra dele? Toque em SIM.\n\nA conta extra fica com valor e lucro zero e a etiqueta Conta extra. Ela precisa de servidor, usuário, senha, conexões e vencimento (telefone não). Não tem alerta de WhatsApp e é ativada separada, descontando os créditos do próprio servidor. O lucro da ficha principal já desconta o custo das contas extras.\n\nSe marcou por engano, abra a conta extra e toque em Deixar de ser conta extra."], ["Como editar ou consultar um cliente?", "Na aba Clientes ou em Hoje, toque no ícone do lápis no cartão do cliente."], ["Como encontrar um cliente?", "Na aba Clientes, digite nome, telefone ou usuário na busca. Para refinar, use os filtros de servidor, tipo (assinatura ou licença) e situação (Vencidos, Ativos ou Arquivados). Ao digitar na busca, o app procura em todas as situações. Ao escolher Só licenças de app, o app já mostra todas as licenças em ordem de vencimento, da mais antiga para a mais nova."], ["Como arquivar um cliente?", "Editar cliente > Arquivar cliente. Ele sai da lista e dos totais, mas os dados ficam guardados em Clientes > Arquivados. Vencidos há mais de 90 dias são arquivados sozinhos."], ["Como reativar um cliente arquivado?", "Em Clientes, escolha a situação Arquivados e toque em Reativar. Depois toque em Pagou e, em seguida, em Ativar para definir o novo vencimento."]]], ["SERVIDORES", [["Como cadastrar um servidor?", "Na aba Gestão, toque em + Novo servidor e digite o nome. Depois toque em Editar para completar: custo do crédito, saldo de créditos, link do painel, DNS e cor.\n\nPainéis de licença de aplicativo (ex.: RedCine, Focoxplay): em Tipo do servidor, escolha Painel de licenças e preencha quantos créditos são gastos em 1 ano e no Vitalício. O painel não aparece na escolha de servidor das assinaturas, só no campo Painel de créditos das licenças."], ["Posso renomear um servidor?", "Sim. Em Gestão, toque em Editar no servidor, troque o Nome do servidor e toque em Salvar. O app mostra quantos clientes serão atualizados e, ao confirmar, troca o nome em todos eles, inclusive arquivados e contas disponíveis. Créditos, lucro, botão Painel e links .ts e .hls continuam funcionando."], ["Como migrar um cliente de servidor?", "Editar cliente, trocar o Servidor na lista e salvar. Os dados e o vencimento continuam. O app pergunta se você quer disponibilizar a conta antiga para reutilização."], ["O que é Conta disponível?", "É a conta que sobrou depois de uma migração. Ela aparece na aba Hoje até a data de validade. Toque em Usar para reaproveitá-la em outro cliente: o cadastro abre sem nome, e você preenche os dados do novo cliente."], ["Como usar o link M3U?", "Em Novo cliente, cole o link da lista no campo Migrar de outro servidor (opcional). O app lê o link e preenche usuário e senha sozinho."], ["Como copiar usuário, senha e links?", "No cartão, toque em Usuário e senha para copiar. A seta ▾ muda o formato. Os botões .ts e .hls copiam a lista, se o DNS do servidor estiver cadastrado."]]], ["FINANCEIRO", [["Como o lucro é calculado?", "Lucro = valor cobrado menos (custo do crédito × conexões). O custo fica no servidor, em Gestão > Editar.\n\nSe o cliente tem contas extras, o custo de cada uma (custo do servidor dela × conexões) também sai do lucro da ficha principal. A conta extra fica com lucro zero.\n\nNa licença com painel de créditos: valor cobrado menos (custo do crédito × créditos da duração). Exemplo com crédito de R$ 11,00: anual de R$ 15,00 dá 15,00 − 11,00 = 4,00; vitalícia de R$ 80,00 dá 80,00 − 22,00 = 58,00. Na licença sem painel, o lucro é digitado à mão."], ["Como controlar os créditos?", "Cada Ativar desconta os créditos do servidor. Com 3 créditos ou menos, aparece o aviso Crédito baixo em Hoje. Para somar uma recarga: Gestão > Adicionar créditos."], ["Como ver meu lucro?", "A aba Gestão mostra o lucro dos clientes ativos e quantos clientes e conexões você tem. Em Lucro mensal, toque em Registrar este mês agora para guardar o mês."], ["Como alterar o valor de vários clientes?", "Em Gestão, toque em Editar no servidor e desça até Alterar valor dos clientes. Informe o valor atual e o novo valor, confira a lista e toque em Alterar. Se errar, toque em Desfazer alteração."]]], ["VENCIMENTOS", [["Como ver quem vence?", "A aba Hoje mostra os clientes em grupos: Recargas para fazer, Hoje e amanhã, Vencidos há 3 a 4 dias, Em 2 a 3 dias e Licenças de app."], ["Como registrar uma renovação?", "Quando o cliente pagar, toque em Pagou. Faça a recarga no painel do servidor e toque em Ativar: o app define o novo vencimento e desconta o crédito.\n\nEsqueceu de tocar em Pagou no dia? Toque no lápis, preencha Pago em com a data do pagamento e toque em Salvar: o pagamento entra em Últimos pagamentos com essa data. Depois, toque em Ativar normalmente."], ["Errei um pagamento. E agora?", "Abra Editar cliente e toque em Desfazer pagamento (ou Desfazer ativação, se você já ativou)."], ["Como enviar a cobrança?", "Toque no botão verde do WhatsApp no cartão: a conversa abre com a mensagem pronta. Depois de enviar, toque de novo e responda SIM em Enviou a mensagem de alerta?: o botão ganha um ✓ e o cartão mostra a data do envio (📩 DD/MM). Os dois ficam até você tocar em Ativar.\n\nA partir do 3º dia vencido e até a ativação, o botão continua abrindo a mensagem de conta vencida (ou de licença), e cada SIM atualiza a data. Contas extras e licenças vitalícias não têm alerta.\n\nPara mudar o texto, vá em Backup > Mensagens de WhatsApp."]]], ["OUTRAS FUNCIONALIDADES", [["Como usar as observações?", "Escreva no campo Observações do cadastro. Quando houver texto, aparece um ícone de nota ao lado do nome. Toque no nome para ler."], ["Como fazer backup?", "Na aba Backup, toque em Exportar backup. Na primeira vez, o app pede uma senha (mínimo de 6 caracteres) e o arquivo exportado é criptografado. Anote a senha: sem ela o backup não abre. Faça toda semana, porque seus dados ficam só neste aparelho."], ["Como restaurar os dados?", "Na aba Backup, toque em Importar backup, escolha o arquivo salvo e digite a senha do backup."], ["Como importar minha planilha?", "Na aba Backup, toque em Baixar planilha modelo (.xlsx), preencha e depois toque em Importar planilha (.xlsx)."], ["Como bloquear o app com PIN?", "Na aba Backup, toque em Definir PIN (de 4 a 8 números). Ele é pedido ao abrir o app."], ["Como usar a lista de Aplicativos?", "Na aba Gestão, no cartão Aplicativos, toque em + Cadastrar aplicativo e informe o nome e o link do site. Toque em Abrir aplicativo para ver a lista: tocar no nome abre o site, e o lápis edita ou apaga. Os aplicativos da lista aparecem para escolher no cadastro de licenças."]]]];
